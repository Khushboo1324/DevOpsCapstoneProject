name: TaskBoard CI/CD
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: taskboard-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: pytest -q
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - run: |
          helm lint helm/taskboard
          helm template taskboard helm/taskboard -n taskboard > /tmp/default.yaml
          helm template taskboard helm/taskboard -n taskboard -f helm/taskboard/values-dev.yaml --set serviceMonitor.enabled=true > /tmp/dev.yaml
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - name: Validate infrastructure without cloud access
        working-directory: terraform
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate
      - run: docker compose config --quiet
  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_prefix: ${{ steps.names.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
      - id: names
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend locally
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: ${{ steps.names.outputs.prefix }}-backend:${{ github.sha }}
      - name: Build frontend locally
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: ${{ steps.names.outputs.prefix }}-frontend:${{ github.sha }}
      - name: Scan backend
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.names.outputs.prefix }}-backend:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
      - name: Scan frontend
        if: success() || failure()
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.names.outputs.prefix }}-frontend:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
      # Neither image is published until BOTH scans pass.
      - name: Push exact scanned images
        env:
          PREFIX: ${{ steps.names.outputs.prefix }}
          SHA: ${{ github.sha }}
        run: |
          docker push "$PREFIX-backend:$SHA"
          docker push "$PREFIX-frontend:$SHA"
  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.35.0
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - name: Configure EKS context
        env:
          CLUSTER: ${{ vars.EKS_CLUSTER_NAME }}
          REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
        run: aws eks update-kubeconfig --name "$CLUSTER" --region "$REGION"
      - name: Deploy this commit
        env:
          PREFIX: ${{ needs.publish.outputs.image_prefix }}
          SHA: ${{ github.sha }}
          HOST: ${{ vars.TASKBOARD_HOST || 'taskboard.local' }}
          INGRESS_CLASS: ${{ vars.INGRESS_CLASS || 'nginx' }}
          MONITORING: ${{ vars.ENABLE_MONITORING || 'false' }}
        run: |
          helm upgrade --install taskboard ./helm/taskboard \
            --namespace taskboard --atomic --wait --timeout 10m \
            -f helm/taskboard/values-dev.yaml \
            --set-string backend.image.repository="$PREFIX-backend" \
            --set-string frontend.image.repository="$PREFIX-frontend" \
            --set-string backend.image.tag="$SHA" \
            --set-string frontend.image.tag="$SHA" \
            --set-string postgres.existingSecret=taskboard-db \
            --set-string postgres.storageClass=taskboard-gp3 \
            --set-string ingress.host="$HOST" \
            --set-string ingress.className="$INGRESS_CLASS" \
            --set serviceMonitor.enabled="$MONITORING"
          kubectl rollout status deployment/taskboard-backend -n taskboard --timeout=120s
